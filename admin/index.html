<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#050a12">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://pwbpxhsucidjgmlneksz.supabase.co; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Acesso privado | Nexo Studio</title>
  <link rel="icon" href="../assets/nexo-icon.png"><link rel="stylesheet" href="admin.css?v=1">
  <script defer src="../analytics-config.js?v=2"></script><script defer src="auth.js?v=1"></script>
</head>
<body class="login-page" data-page="login">
  <main class="login-shell">
    <a class="brand" href="../" aria-label="Nexo Studio, voltar ao site"><img src="../assets/nexo-icon.png" width="42" height="42" alt=""><span>NEXO<span class="brand-small">STUDIO / ANALYTICS</span></span></a>
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow"><span class="dot"></span> ACESSO PRIVADO</p>
      <h1 id="login-title">Tudo conectado.<br><span>Agora, em números.</span></h1>
      <p class="muted intro-copy">Entre para acompanhar o movimento da Nexo.</p>
      <form id="login-form">
        <label for="username">Usuário</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="80" required placeholder="Seu usuário">
        <label for="password">Senha</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required placeholder="Sua senha"><button id="toggle-password" class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div>
        <button class="button primary login-submit" type="submit">Entrar no painel <span aria-hidden="true">↗</span></button>
        <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
      </form>
      <p class="login-note">Recarregou a página? A senha será solicitada novamente.</p>
      <noscript><p class="notice error">Ative o JavaScript para entrar no painel.</p></noscript>
    </section>
    <p class="login-footer">Nexo Studio · Painel de tráfego e interesse</p>
  </main>
</body>
</html>
